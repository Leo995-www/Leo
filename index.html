<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centrum Nauki – Jan i Jakub</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#edf3fa;color:#17324d;margin:0}main{max-width:850px;margin:auto;padding:20px}header{background:linear-gradient(120deg,#1d477c,#277c94);color:white;padding:30px;border-radius:22px}h1{margin:0 0 10px}h2{margin:8px 0}p{line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:20px 0}.tile,.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 3px 15px #17324d12}.tile{border:2px solid transparent;cursor:pointer;text-align:left;color:inherit;font:inherit}.tile.selected{border-color:#207e9d;background:#e5f6fa}.tile strong{font-size:24px;display:block;margin:8px 0}.muted{color:#5d6c7b;font-size:14px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border:1px solid #dbe5ef;border-radius:13px;margin:12px 0}.item a{font-weight:700;color:#116b8e;text-decoration:none}.item small{display:block;color:#61738a;margin-top:5px}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px;background:#e4eef6;color:#194b67}.hide{color:#a43d3d;background:#fff0f0;font-size:13px}.tools{margin-top:14px}footer{margin:25px 0;color:#647588;font-size:13px}@media(max-width:500px){.grid{gap:9px}.tile{padding:16px}.item{align-items:flex-start;flex-direction:column}}</style></head><body><main><header><h1>📚 Centrum Nauki</h1><p>Wybierz ucznia, a następnie przedmiot i materiał do nauki.</p></header><div class="grid"><button class="tile" id="janBtn" onclick="choose('jan')"><span>👦</span><strong>Jan</strong><span class="muted">Materiały do nauki</span></button><button class="tile" id="jakubBtn" onclick="choose('jakub')"><span>🧑‍🎓</span><strong>Jakub</strong><span class="muted">Historia i geografia</span></button></div><div class="panel" id="panel"><h2>Wybierz ucznia</h2><p>Materiały są uporządkowane osobno dla Jana i Jakuba.</p></div><footer>Materiały szkolne • Centrum Nauki</footer></main><script>const items={jan:[{id:'angielski-zwierzeta',subject:'Angielski',title:'Słówka zwierzęta',info:'25 fiszek i test z 25 pytań',url:'jan/angielski-zwierzeta/'}],jakub:[{id:'historia',subject:'Historia',title:'Rzeczpospolita szlachecka',info:'57 fiszek i 57 pytań • klasa 6',url:'jakub/historia/'},{id:'geografia',subject:'Geografia',title:'Ruchy Ziemi',info:'40 fiszek i 40 pytań • klasa 6',url:'jakub/geografia-ruchy-ziemi/'}]};let current='';let hidden={};try{hidden=JSON.parse(localStorage.getItem('centrum-nauki-hidden-v1')||'{}')}catch(e){}function choose(who){current=who;document.querySelectorAll('.tile').forEach(b=>b.classList.remove('selected'));document.getElementById(who+'Btn').classList.add('selected');render()}function render(){const p=document.getElementById('panel');p.replaceChildren();const h=document.createElement('h2');h.textContent=current==='jan'?'Jan – materiały':'Jakub – materiały';p.append(h);const visible=items[current].filter(x=>!hidden[current+':'+x.id]);if(!visible.length){const t=document.createElement('p');t.textContent='Na razie brak widocznych materiałów. Nowe sprawdziany i fiszki będą dodawane tutaj.';p.append(t)}for(const x of visible){const d=document.createElement('div');d.className='item';const left=document.createElement('div');const a=document.createElement('a');a.href=x.url;a.textContent=x.subject+' – '+x.title;const small=document.createElement('small');small.textContent=x.info;left.append(a,small);const b=document.createElement('button');b.className='hide';b.textContent='Ukryj';b.title='Ukryj na tym urządzeniu – nie usuwa plików z GitHub';b.onclick=()=>{if(confirm('Ukryć ten materiał na tym urządzeniu? Plik pozostanie na stronie i można go przywrócić.')){hidden[current+':'+x.id]=true;localStorage.setItem('centrum-nauki-hidden-v1',JSON.stringify(hidden));render()}};d.append(left,b);p.append(d)}const tools=document.createElement('div');tools.className='tools';const restore=document.createElement('button');restore.textContent='↺ Przywróć ukryte materiały';restore.onclick=()=>{for(const x of items[current])delete hidden[current+':'+x.id];localStorage.setItem('centrum-nauki-hidden-v1',JSON.stringify(hidden));render()};tools.append(restore);p.append(tools);const note=document.createElement('p');note.className='muted';note.textContent='Ukrywanie działa tylko w tej przeglądarce. Aby trwale usunąć ukończony sprawdzian ze strony, poproś o jego usunięcie w czacie.';p.append(note)}choose('jakub');</script></body></html>
