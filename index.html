<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centrum Nauki – Historia 6</title><style>body{font:17px system-ui;background:#eef3fc;color:#172544;margin:0}main{max-width:700px;margin:auto;padding:18px}header{background:#213c80;color:white;padding:25px;border-radius:18px}h1{margin:0}header p{margin-bottom:0}section{background:white;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 3px 12px #1d346018}button,select{font:inherit;padding:13px;border-radius:12px;border:0;margin:5px;cursor:pointer}button{background:#e3ebff;color:#193775;font-weight:650}button.active,.primary{background:#315ad5;color:white}.card{background:#edf3ff;border:2px solid #b8c9f5;border-radius:18px;min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:23px;font-weight:650;margin:16px 0;cursor:pointer}.good{background:#d9f6e4}.bad{background:#ffe3e3}.option{display:block;width:100%;text-align:left;margin:9px 0}.picked{outline:3px solid #4268d7}.correct{background:#c9f3d9}.wrong{background:#ffd0d0}.hidden{display:none}.muted{color:#5f6e88;font-size:14px}#status{font-weight:bold}select{background:#f1f4fb;max-width:100%}</style></head><body><main><header><h1>📚 Centrum Nauki</h1><p>Historia • klasa 6 • Rzeczpospolita szlachecka</p></header><section><button id="bf" class="active" onclick="mode('f')">🗂️ Fiszki</button><button id="bq" onclick="mode('q')">🧠 Quiz</button><p class="muted">57 zagadnień. Postępy zapisują się w tej przeglądarce.</p></section><section id="f"><h2>Fiszki – nauka</h2><p>Dotknij karty, aby odkryć odpowiedź.</p><p id="fstat"></p><div class="card" id="card" onclick="flip()"></div><button class="bad" onclick="rate(false)">✗ Powtórz</button><button class="good" onclick="rate(true)">✓ Umiem</button><button onclick="resetF(true)">Tylko trudne</button><button onclick="resetF(false)">Od początku</button></section><section id="q" class="hidden"><h2>Quiz – sprawdzian</h2><div id="setup"><label>Liczba pytań: <select id="count"><option>10</option><option>20</option><option value="57">Wszystkie</option></select></label><p><button class="primary" onclick="start(false)">Nowy quiz</button><button onclick="start(true)">Powtórka błędów</button></p></div><div id="game" class="hidden"><p id="status"></p><h3 id="question"></h3><div id="options"></div><p id="feedback"></p><button class="primary" id="next" onclick="advance()">Sprawdź</button></div><div id="finish" class="hidden"><h2 id="result"></h2><p id="summary"></p><button onclick="start(false)">Nowy quiz</button><button onclick="start(true)">Powtórz błędy</button></div></section></main><script>const D=[["Sejm walny","Król, senat i izba poselska."],["Sejmiki ziemskie","Lokalne zgromadzenia szlachty wybierające posłów."],["Gołota","Szlachta bez własnej ziemi."],["Arrasy","Ozdobne tkaniny ścienne, m.in. na Wawelu."],["Innowierca","Wyznawca innej religii."],["Tolerancja religijna","Poszanowanie prawa do wyznawania różnych religii."],["Złoty wiek","Rozkwit Polski w XVI wieku."],["Wolna elekcja","Wybór króla przez szlachtę."],["Pacta conventa","Osobiste zobowiązania nowo wybranego króla."],["Artykuły henrykowskie","Stałe zasady obowiązujące królów elekcyjnych."],["Interrex","Prymas zastępujący króla podczas bezkrólewia."],["Hołd pruski – rok","1525"],["Hołd pruski – kto komu?","Albrecht Hohenzollern Zygmuntowi I Staremu."],["Hołd pruski – skutek","Prusy Książęce stały się lennem Polski."],["Unia lubelska – rok","1569"],["Unia lubelska – skutek","Powstała Rzeczpospolita Obojga Narodów."],["Unia lubelska – co wspólne?","Monarcha i sejm."],["Unia lubelska – co oddzielne?","Wojsko, skarb, urzędy i prawo."],["Pierwsza wolna elekcja – rok","1573"],["Pierwszy król elekcyjny","Henryk Walezy."],["Królowa Bona","Żona Zygmunta I Starego; wspierała gospodarkę i renesans."],["Zygmunt I Stary","Król, który przyjął hołd pruski."],["Zygmunt II August","Ostatni Jagiellon na polskim tronie; unia lubelska."],["Jan Olbracht","Król, który wyprawił się na Mołdawię w 1497 r."],["Henryk Walezy","Pierwszy król elekcyjny Polski."],["Mikołaj Kopernik","Astronom, twórca teorii heliocentrycznej."],["Jan Kochanowski","Poeta renesansu, autor Trenów i Fraszek."],["Mikołaj Rej","Pisarz tworzący w języku polskim."],["Bitwa pod Orszą – rok","1514"],["Wyprawa Jana Olbrachta na Mołdawię – rok","1497"],["Statuty piotrkowskie – rok","1496"],["Wybuch wojny o Inflanty – rok","1558"],["Konfederacja warszawska – rok","1573"],["Odzyskanie Pomorza Gdańskiego – rok","1466"],["Nihil Novi – rok","1505"],["Nihil Novi – znaczenie","Król nie mógł stanowić nowych praw bez zgody sejmu."],["Izby sejmu walnego","Senat i izba poselska."],["Senat – kto zasiadał?","M.in. biskupi, wojewodowie i kasztelanowie."],["Izba poselska – kto zasiadał?","Posłowie wybrani na sejmikach."],["Folwark","Duże gospodarstwo szlacheckie produkujące na sprzedaż."],["Pańszczyzna","Obowiązkowa praca chłopów na rzecz pana."],["Rozwój folwarków – przyczyna","Rosnący popyt na zboże."],["Warstwy szlachty","Magnateria, średnia, zagrodowa, gołota."],["Prawa polityczne szlachty","Sejmiki, wybór posłów, udział w elekcji."],["Magnateria","Najbogatsza warstwa szlachty."],["Szlachta zagrodowa","Drobna szlachta gospodarująca na małej ziemi."],["Narody Rzeczypospolitej","M.in. Polacy, Litwini, Rusini, Żydzi, Niemcy, Ormianie."],["Wyznania Rzeczypospolitej","M.in. katolicyzm, prawosławie, protestantyzm, judaizm."],["Konfederacja warszawska – znaczenie","Gwarancja pokoju religijnego wśród różnowierczej szlachty."],["Renesans – cechy","Humanizm, inspiracja antykiem, rozwój nauki i sztuki."],["Kaplica Zygmuntowska","Przykład polskiej architektury renesansowej na Wawelu."],["Główny port eksportu zboża","Gdańsk."],["Bitwa pod Orszą – wynik","Zwycięstwo wojsk polsko-litewskich nad moskiewskimi."],["Drugi pokój toruński – rok","1466"],["Dlaczego Polska miała złoty wiek?","Rozkwit kultury, gospodarki i znaczenia państwa."],["Artykuły henrykowskie – kiedy?","1573"],["Co zakończyło dynastię Jagiellonów?","Bezpotomna śmierć Zygmunta II Augusta."]],KEY='leo-history-6';let store={known:{},errors:{}};try{store={...store,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(store))}const el=id=>document.getElementById(id);function mode(m){el('f').classList.toggle('hidden',m!=='f');el('q').classList.toggle('hidden',m!=='q');el('bf').classList.toggle('active',m==='f');el('bq').classList.toggle('active',m==='q')}let deck=[],idx=0,back=false;function resetF(hard=false){deck=D.map((x,i)=>i).filter(i=>!hard||!store.known[i]);idx=0;back=false;drawF()}function drawF(){let i=deck[idx];el('fstat').textContent='Fiszka '+Math.min(idx+1,deck.length)+' / '+deck.length+' • Opanowane: '+Object.values(store.known).filter(Boolean).length+'/'+D.length;el('card').textContent=i===undefined?'Brawo! Nie ma już fiszek do powtórki 🎉':D[i][back?1:0]}function flip(){if(deck[idx]!==undefined){back=!back;drawF()}}function rate(ok){let i=deck[idx];if(i===undefined)return;store.known[i]=ok;save();idx++;back=false;drawF()}let qs=[],pos=0,score=0,choice=null,checked=false;function start(onlyErrors){let pool=D.map((x,i)=>i).filter(i=>!onlyErrors||store.errors[i]);if(!pool.length){alert('Nie ma błędów do powtórki. Rozwiąż najpierw quiz.');return}pool.sort(()=>Math.random()-.5);qs=pool.slice(0,Number(el('count').value));pos=0;score=0;el('setup').classList.add('hidden');el('finish').classList.add('hidden');el('game').classList.remove('hidden');drawQ()}let opts=[];function drawQ(){choice=null;checked=false;let i=qs[pos],a=D[i][1];let distract=D.map((x,j)=>x[1]).filter(x=>x!==a&&x.length<140);distract=[...new Set(distract)].sort(()=>Math.random()-.5);opts=[a,...distract.slice(0,3)].sort(()=>Math.random()-.5);el('status').textContent='Pytanie '+(pos+1)+'/'+qs.length+' • Punkty: '+score;el('question').textContent=D[i][0]+' — wybierz poprawną odpowiedź.';el('options').replaceChildren();opts.forEach((x,j)=>{let b=document.createElement('button');b.className='option';b.textContent='ABCD'[j]+'. '+x;b.onclick=()=>{if(checked)return;choice=j;[...el('options').children].forEach((z,k)=>z.classList.toggle('picked',j===k))};el('options').append(b)});el('feedback').textContent='';el('next').textContent='Sprawdź'}function advance(){if(!checked){if(choice===null)return;checked=true;let i=qs[pos],a=D[i][1],ok=opts[choice]===a;if(ok){score++;delete store.errors[i]}else store.errors[i]=true;save();[...el('options').children].forEach((b,j)=>{b.disabled=true;b.classList.toggle('correct',opts[j]===a);b.classList.toggle('wrong',j===choice&&!ok)});el('feedback').textContent=(ok?'✅ Dobrze! ':'❌ Spróbuj zapamiętać: ')+a;el('next').textContent=pos===qs.length-1?'Zobacz wynik':'Następne pytanie';return}pos++;if(pos<qs.length)drawQ();else{el('game').classList.add('hidden');el('finish').classList.remove('hidden');el('result').textContent='Wynik: '+score+'/'+qs.length+' ('+Math.round(score/qs.length*100)+'%)';el('summary').textContent='Błędne odpowiedzi możesz przećwiczyć osobno.'}}resetF();</script></body></html>
