</section><section id="q" class="hidden"><h2>Quiz – sprawdzian</h2><div id="setup"><label>Liczba pytań: <select id="count"><option>10</option><option>20</option><option value="57">Wszystkie</option></select></label><p><button class="primary" onclick="start(false)">Nowy quiz</button><button onclick="start(true)">Powtórka błędów</button></p></div><div id="game" class="hidden"><p id="status"></p><h3 id="question"></h3><div id="options"></div><p id="feedback"></p><button class="primary" id="next" onclick="advance()">Sprawdź</button></div><div id="finish" class="hidden"><h2 id="result"></h2><p id="summary"></p><button onclick="start(false)">Nowy quiz</button><button onclick="start(true)">Powtórz błędy</button></div></section></main><script>const T=[["Z jakich trzech części składał się sejm walny?","Z króla, senatu i izby poselskiej.","Z króla, senatu i izby poselskiej.","Z króla, rady miejskiej i senatu.","Z króla, sejmików i sądów.","Z senatu, duchowieństwa i mieszczan."],["Czym były sejmiki ziemskie?","Zgromadzeniami szlachty z danej ziemi, m.in. wybierającymi posłów na sejm.","Zgromadzeniami szlachty danej ziemi.","Zjazdami wyłącznie senatorów.","Zebraniami kupców w miastach.","Sądami rozstrzygającymi sprawy chłopów."],["Kim była gołota?","Szlachtą nieposiadającą własnej ziemi.","Szlachtą bez własnej ziemi.","Najbogatszą szlachtą.","Szlachtą posiadającą niewielkie gospodarstwa.","Mieszczanami posiadającymi folwarki."],["Czym były arrasy?","Bogato zdobionymi tkaninami ściennymi, które zdobiły m.in. Wawel.","Ozdobnymi tkaninami ściennymi.","Malowidłami na deskach.","Kamiennymi rzeźbami.","Księgami z prawami szlachty."],["Kogo w XVI-wiecznej Polsce nazywano innowiercą?","Osobę wyznającą religię inną niż dominujący katolicyzm.","Wyznawcę religii innej niż katolicyzm.","Wyłącznie katolickiego duchownego.","Osobę należącą do szlachty.","Każdego mieszkańca miasta."],["Co oznacza tolerancja religijna?","Poszanowanie prawa innych osób do wyznawania własnej religii.","Poszanowanie prawa do różnych wyznań.","Nakaz wyznawania jednej religii.","Zakaz budowania świątyń.","Obowiązek zmiany wyznania."],["Dlaczego XVI wiek nazywamy złotym wiekiem Polski?","Ze względu na rozwój kultury, nauki, gospodarki i znaczenia państwa.","Rozwój kultury, nauki i gospodarki.","Ponieważ odkryto duże złoża złota.","Ponieważ nie istniał handel.","Ponieważ zniesiono wszystkie podatki."],["Na czym polegała wolna elekcja?","Na wyborze króla przez uprawnioną do udziału szlachtę.","Na wyborze króla przez szlachtę.","Na dziedziczeniu tronu przez syna.","Na mianowaniu króla przez papieża.","Na wyborze króla wyłącznie przez mieszczan."],["Czym były pacta conventa?","Osobistymi zobowiązaniami przyjmowanymi przez nowo wybranego króla.","Osobistymi zobowiązaniami króla elekcyjnego.","Zbiorem praw miejskich.","Umową Polski z zakonem krzyżackim.","Zasadami uprawy ziemi."],["Czym były artykuły henrykowskie?","Stałymi zasadami ustrojowymi, które musiał uznać każdy król elekcyjny.","Stałymi zasadami obowiązującymi królów elekcyjnych.","Osobistymi obietnicami tylko jednego króla.","Prawami wyłącznie dla mieszczan.","Układem handlowym z Litwą."],["Kim był interrex w okresie bezkrólewia?","Osobą zastępującą monarchę; w Rzeczypospolitej funkcję tę pełnił prymas.","Prymasem pełniącym obowiązki podczas bezkrólewia.","Hetmanem dowodzącym armią.","Marszałkiem izby poselskiej.","Wojewodą krakowskim."],["W którym roku odbył się hołd pruski?","W 1525 roku.","1525","1514","1505","1569"],["Kto złożył hołd pruski i komu?","Albrecht Hohenzollern złożył hołd Zygmuntowi I Staremu.","Albrecht Hohenzollern Zygmuntowi I Staremu.","Zygmunt II August Albrechtowi Hohenzollernowi.","Henryk Walezy Zygmuntowi I Staremu.","Jan Olbracht Zygmuntowi II Augustowi."],["Jaki był najważniejszy skutek hołdu pruskiego?","Prusy Książęce stały się lennem Królestwa Polskiego.","Prusy Książęce stały się lennem Polski.","Prusy Książęce przyłączono do Litwy.","Polska utraciła Pomorze Gdańskie.","Rozwiązano zakon krzyżacki w całej Europie."],["W którym roku zawarto unię lubelską?","W 1569 roku.","1569","1558","1573","1525"],["Jak nazywało się państwo utworzone przez unię lubelską?","Rzeczpospolita Obojga Narodów.","Rzeczpospolita Obojga Narodów.","Królestwo Prus.","Wielkie Księstwo Moskiewskie.","Święte Cesarstwo Rzymskie."],["Co było wspólne dla Korony i Litwy po unii lubelskiej?","Między innymi wybierany wspólnie monarcha i sejm.","Monarcha i sejm.","Wojsko i skarb.","Sądy i urzędy lokalne.","Prawo i administracja."],["Co zachowały oddzielnie Korona i Litwa po unii lubelskiej?","Między innymi wojsko, skarb, urzędy i prawo.","Wojsko, skarb, urzędy i prawo.","Monarchę i sejm.","Politykę zagraniczną i monarchę.","Wspólną izbę poselską."],["W którym roku odbyła się pierwsza wolna elekcja?","W 1573 roku.","1573","1569","1572","1587"],["Kto został pierwszym królem wybranym w wolnej elekcji?","Henryk Walezy.","Henryk Walezy.","Stefan Batory.","Zygmunt II August.","Zygmunt I Stary."],["Kim była królowa Bona?","Żoną Zygmunta I Starego; wspierała rozwój gospodarki i kultury renesansowej.","Żoną Zygmunta I Starego.","Żoną Henryka Walezego.","Córką Jana Olbrachta.","Pierwszą królową wybraną w wolnej elekcji."],["Który król przyjął hołd pruski w 1525 roku?","Zygmunt I Stary.","Zygmunt I Stary.","Zygmunt II August.","Jan Olbracht.","Henryk Walezy."],["Który król był ostatnim Jagiellonem na polskim tronie?","Zygmunt II August.","Zygmunt II August.","Zygmunt I Stary.","Jan Olbracht.","Henryk Walezy."],["Który król zorganizował wyprawę na Mołdawię w 1497 roku?","Jan Olbracht.","Jan Olbracht.","Zygmunt I Stary.","Zygmunt II August.","Stefan Batory."],["Kim był Henryk Walezy w dziejach Polski?","Pierwszym królem wybranym w wolnej elekcji.","Pierwszym królem elekcyjnym.","Ostatnim królem z dynastii Jagiellonów.","Królem, który przyjął hołd pruski.","Twórcą unii lubelskiej."],["Z czego zasłynął Mikołaj Kopernik?","Sformułował teorię heliocentryczną, według której Ziemia krąży wokół Słońca.","Ze sformułowania teorii heliocentrycznej.","Z napisania Trenów.","Z budowy Kaplicy Zygmuntowskiej.","Z opracowania artykułów henrykowskich."],["Z jakich utworów słynie Jan Kochanowski?","Między innymi z Trenów i Fraszek.","Z Trenów i Fraszek.","Z O obrotach sfer niebieskich.","Z kroniki Galla Anonima.","Z artykułów henrykowskich."],["Dlaczego Mikołaj Rej jest ważną postacią polskiego renesansu?","Był jednym z pierwszych wybitnych pisarzy tworzących w języku polskim.","Tworzył literaturę w języku polskim.","Opracował teorię heliocentryczną.","Dowodził wojskami pod Orszą.","Zaprojektował Kaplicę Zygmuntowską."],["W którym roku rozegrała się bitwa pod Orszą?","W 1514 roku.","1514","1525","1497","1505"],["W którym roku Jan Olbracht wyprawił się na Mołdawię?","W 1497 roku.","1497","1496","1505","1514"],["W którym roku uchwalono statuty piotrkowskie?","W 1496 roku.","1496","1497","1505","1466"],["W którym roku rozpoczęła się wojna o Inflanty?","W 1558 roku.","1558","1569","1514","1573"],["W którym roku uchwalono konfederację warszawską?","W 1573 roku.","1573","1569","1558","1587"],["W którym roku Polska odzyskała Pomorze Gdańskie?","W 1466 roku, na mocy drugiego pokoju toruńskiego.","1466","1496","1525","1514"],["W którym roku uchwalono konstytucję Nihil novi?","W 1505 roku.","1505","1496","1514","1525"],["Co oznaczała zasada Nihil novi?","Król nie mógł ustanawiać nowych praw bez zgody sejmu.","Król nie mógł ustanawiać nowych praw bez zgody sejmu.","Król mógł samodzielnie nakładać nowe prawa.","Wyłącznie senat mógł wybierać króla.","Chłopi otrzymali prawo głosu w sejmie."],["Jak nazywały się dwie izby sejmu walnego?","Senat i izba poselska.","Senat i izba poselska.","Senat i rada miejska.","Sejmiki i sądy ziemskie.","Izba poselska i rada królewska."],["Kto zasiadał w senacie?","Między innymi biskupi, wojewodowie i kasztelanowie.","Biskupi, wojewodowie i kasztelanowie.","Posłowie wybrani przez chłopów.","Wszyscy mieszczanie.","Wyłącznie przedstawiciele cechów."],["Kto zasiadał w izbie poselskiej?","Posłowie szlacheccy wybrani na sejmikach ziemskich.","Posłowie wybrani na sejmikach.","Wyłącznie biskupi.","Wszyscy chłopi.","Wyłącznie kasztelanowie."],["Czym był folwark szlachecki?","Dużym gospodarstwem rolnym nastawionym na produkcję na sprzedaż.","Dużym gospodarstwem produkującym na sprzedaż.","Miejskim warsztatem rzemieślniczym.","Małym ogrodem przy domu chłopa.","Zamkiem służącym do obrony."],["Na czym polegała pańszczyzna?","Na obowiązkowej pracy chłopów na rzecz właściciela ziemi.","Na obowiązkowej pracy chłopów dla pana.","Na dobrowolnej pracy za wynagrodzenie.","Na podatku płaconym przez kupców.","Na służbie wojskowej mieszczan."],["Dlaczego w XVI wieku rozwijały się folwarki?","Ponieważ rósł popyt na zboże, które sprzedawano także za granicę.","Ponieważ rósł popyt na zboże.","Ponieważ zakazano handlu zbożem.","Ponieważ zniknęły miasta.","Ponieważ przestano uprawiać rolę."],["Na jakie główne grupy dzieliła się szlachta?","Na magnaterię, szlachtę średnią, zagrodową i gołotę.","Magnateria, szlachta średnia, zagrodowa i gołota.","Magnateria, duchowieństwo, chłopi i kupcy.","Rycerze, mieszczanie, duchowni i chłopi.","Patrycjat, pospólstwo, plebs i duchowieństwo."],["Jakie prawa polityczne posiadała szlachta?","Mogła m.in. uczestniczyć w sejmikach, wybierać posłów i brać udział w elekcji.","Udział w sejmikach, wybór posłów i udział w elekcji.","Wyłączne prawo wyboru papieża.","Prawo nakładania podatków bez sejmu.","Prawo do pracy pańszczyźnianej."],["Kim byli magnaci?","Najbogatszą częścią szlachty, posiadającą rozległe majątki ziemskie.","Najbogatszą szlachtą z wielkimi majątkami.","Szlachtą bez ziemi.","Mieszczanami zajmującymi się handlem.","Chłopami dzierżawiącymi ziemię."],["Kim była szlachta zagrodowa?","Drobna szlachta mająca niewielkie gospodarstwa, często uprawiane samodzielnie.","Drobną szlachtą posiadającą małe gospodarstwa.","Najbogatszą częścią szlachty.","Szlachtą bez żadnej ziemi.","Duchownymi mieszkającymi na wsi."],["Jakie narody zamieszkiwały Rzeczpospolitą Obojga Narodów?","Między innymi Polacy, Litwini, Rusini, Żydzi, Niemcy i Ormianie.","M.in. Polacy, Litwini, Rusini, Żydzi i Niemcy.","Wyłącznie Polacy i Litwini.","Wyłącznie Polacy i Niemcy.","Wyłącznie Litwini i Rusini."],["Jakie religie występowały w Rzeczypospolitej Obojga Narodów?","Między innymi katolicyzm, prawosławie, protestantyzm i judaizm.","Katolicyzm, prawosławie, protestantyzm i judaizm.","Wyłącznie katolicyzm.","Wyłącznie katolicyzm i prawosławie.","Wyłącznie protestantyzm."],["Jakie znaczenie miała konfederacja warszawska z 1573 roku?","Gwarantowała pokój religijny między różnowierczą szlachtą.","Gwarantowała pokój religijny wśród szlachty.","Wprowadzała jedną obowiązkową religię.","Zakazywała obrad sejmu.","Znosiła wszystkie przywileje szlachty."],["Jakie cechy charakteryzowały renesans?","Zainteresowanie człowiekiem, nawiązanie do antyku i rozwój nauki oraz sztuki.","Humanizm, inspiracja antykiem, rozwój nauki i sztuki.","Dominacja stylu gotyckiego i rycerstwa.","Odrzucenie nauki i literatury.","Powrót wyłącznie do sztuki romańskiej."],["Czym jest Kaplica Zygmuntowska na Wawelu?","Jednym z najważniejszych przykładów architektury renesansowej w Polsce.","Przykładem architektury renesansowej.","Gotyckim zamkiem obronnym.","Barokowym pałacem.","Romańską rotundą."],["Które miasto było najważniejszym portem wywozu polskiego zboża?","Gdańsk.","Gdańsk.","Kraków.","Toruń.","Lublin."],["Jak zakończyła się bitwa pod Orszą w 1514 roku?","Zwycięstwem wojsk polsko-litewskich nad wojskami moskiewskimi.","Zwycięstwem wojsk polsko-litewskich.","Zwycięstwem wojsk moskiewskich.","Zwycięstwem wojsk szwedzkich.","Zwycięstwem zakonu krzyżackiego."],["W którym roku zawarto drugi pokój toruński?","W 1466 roku.","1466","1410","1496","1525"],["Co świadczyło o rozkwicie Polski w złotym wieku?","Rozwój gospodarki, nauki, literatury, sztuki oraz znaczenia politycznego państwa.","Rozwój kultury, gospodarki i znaczenia państwa.","Upadek miast i handlu.","Zakaz druku książek.","Całkowite zaprzestanie kontaktów z Europą."],["W którym roku uchwalono artykuły henrykowskie?","W 1573 roku.","1573","1569","1574","1587"],["Jakie wydarzenie zakończyło panowanie Jagiellonów na polskim tronie?","Bezpotomna śmierć Zygmunta II Augusta w 1572 roku.","Bezpotomna śmierć Zygmunta II Augusta.","Hołd pruski.","Bitwa pod Orszą.","Koronacja Zygmunta I Starego."]];const D=T.map(x=>[x[0],x[1]]),KEY='leo-history-6';let store={known:{},errors:{}};try{store={...store,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(store))}const el=id=>document.getElementById(id);function mode(m){el('f').classList.toggle('hidden',m!=='f');el('q').classList.toggle('hidden',m!=='q');el('bf').classList.toggle('active',m==='f');el('bq').classList.toggle('active',m==='q')}let deck=[],idx=0,back=false;function resetF(hard=false){deck=D.map((x,i)=>i).filter(i=>!hard||!store.known[i]);idx=0;back=false;drawF()}function drawF(){let i=deck[idx];el('fstat').textContent='Fiszka '+Math.min(idx+1,deck.length)+' / '+deck.length+' • Opanowane: '+Object.values(store.known).filter(Boolean).length+'/'+D.length;el('card').textContent=i===undefined?'Brawo! Nie ma już fiszek do powtórki 🎉':D[i][back?1:0]}function flip(){if(deck[idx]!==undefined){back=!back;drawF()}}function rate(ok){let i=deck[idx];if(i===undefined)return;store.known[i]=ok;save();idx++;back=false;drawF()}
