<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geografia 6 – Ruchy Ziemi</title><style>body{margin:0;background:#eff5fa;color:#17314b;font:17px system-ui}main{max-width:720px;margin:auto;padding:16px}header{background:linear-gradient(120deg,#104e71,#188b83);color:white;padding:24px;border-radius:20px}section{background:white;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 3px 15px #1233}button,select{font:inherit;border:0;border-radius:12px;padding:12px;margin:5px 3px;cursor:pointer}button{background:#e2edf6;color:#173b56;font-weight:650}.primary,.active{background:#087c79;color:white}.card{min-height:190px;background:#e9f5f4;border:2px solid #88c9c2;border-radius:16px;display:grid;place-items:center;text-align:center;padding:18px;font-size:23px;white-space:pre-line;cursor:pointer}.hidden{display:none}.option{display:block;width:100%;text-align:left;margin:9px 0}.chosen{outline:3px solid #168d8b}.right{background:#c7f2d6}.wrong{background:#ffd4d4}.muted{color:#52677b;font-size:14px}a{color:#0c7678}</style><main><header><h1>🌍 Geografia – klasa 6</h1><p>Ruchy Ziemi • 40 fiszek i 40 pytań</p><small>Centrum Nauki • materiały ćwiczeniowe zgodne z ogólnym zakresem działu</small></header><section><button id="bf" class="active" onclick="mode('f')">🗂️ Fiszki</button><button id="bq" onclick="mode('q')">🧠 Test wiedzy</button><p class="muted">Postępy są zapisywane w przeglądarce na tym urządzeniu.</p></section><section id="f"><h2>Fiszki – nauka</h2><p id="progress"></p><div class="card" id="card" onclick="flip()"></div><button onclick="rate(false)">✗ Jeszcze nie umiem</button><button onclick="rate(true)">✓ Umiem</button><p><button onclick="resetF(true)">Powtórz trudne</button><button onclick="resetF(false)">Wszystkie od nowa</button></p></section><section id="q" class="hidden"><h2>Test wiedzy</h2><div id="setup"><label>Liczba pytań: <select id="count"><option>10</option><option>20</option><option>30</option><option value="40">Wszystkie 40</option></select></label><p><button class="primary" onclick="start(false)">Rozpocznij test</button><button onclick="start(true)">Powtórka błędów</button></p></div><div id="game" class="hidden"><p id="qstat"></p><h3 id="question"></h3><div id="answers"></div><p id="feedback"></p><button class="primary" id="next" onclick="advance()">Sprawdź</button></div><div id="finish" class="hidden"><h2 id="result"></h2><p id="summary"></p><button onclick="start(false)">Nowy test</button><button onclick="start(true)">Powtórz błędy</button></div></section><section class="muted"><a href="../">← Powrót do historii</a></section></main><script>const T=[["Jakie ruchy wykonuje Ziemia?","Obrotowy i obiegowy.","Obrotowy i obiegowy.","Wahadłowy i obrotowy.","Obiegowy i pionowy.","Wyłącznie obrotowy."],["Na czym polega ruch obrotowy?","Obracaniu się Ziemi wokół osi.","Obracaniu się Ziemi wokół osi.","Krążeniu Ziemi wokół Słońca.","Krążeniu Księżyca wokół Ziemi.","Zmianie nachylenia orbity."],["W jakim kierunku obraca się Ziemia?","Z zachodu na wschód.","Z zachodu na wschód.","Ze wschodu na zachód.","Z północy na południe.","Z południa na północ."],["Ile trwa doba słoneczna średnia?","24 godziny.","24 godziny.","12 godzin.","365 dni.","23 godziny."],["Co powoduje następstwo dnia i nocy?","Ruch obrotowy Ziemi.","Ruch obrotowy Ziemi.","Ruch obiegowy Księżyca.","Nachylenie orbity Księżyca.","Zmiany odległości od Słońca."],["Dlaczego Słońce pozornie przesuwa się po niebie?","Z powodu obrotu Ziemi.","Z powodu obrotu Ziemi.","Z powodu obiegu Księżyca.","Z powodu pływów morskich.","Z powodu zmiany pór roku."],["Czym jest górowanie Słońca?","Najwyższym położeniem Słońca nad horyzontem danego dnia.","Najwyższym położeniem Słońca nad horyzontem danego dnia.","Momentem wschodu Słońca.","Momentem zachodu Słońca.","Początkiem doby urzędowej."],["Ile stopni Ziemia obraca się w godzinę?","15°.","15°.","10°.","30°.","45°."],["Ile czasu odpowiada 1° długości geograficznej?","4 minuty.","4 minuty.","1 minuta.","15 minut.","60 minut."],["Jak obliczyć różnicę czasu słonecznego dla 30°?","30 × 4 min = 120 min, czyli 2 godziny.","30 × 4 min = 120 min, czyli 2 godziny.","30 minut.","1 godzina.","4 godziny."],["Gdzie czas słoneczny jest późniejszy?","Na wschód od danego miejsca.","Na wschód od danego miejsca.","Na zachód od danego miejsca.","Zawsze na północy.","Zawsze na południu."],["Czym jest czas strefowy?","Czas przyjęty wspólnie dla danej strefy.","Czas przyjęty wspólnie dla danej strefy.","Czas zależny wyłącznie od szerokości.","Czas identyczny na całej Ziemi.","Czas mierzony tylko w południe."],["Ile wynosi umowna szerokość strefy czasowej?","15° długości geograficznej.","15° długości geograficznej.","5° szerokości geograficznej.","30° długości geograficznej.","60° szerokości geograficznej."],["Co oznacza UTC?","Uniwersalny czas koordynowany.","Uniwersalny czas koordynowany.","Czas wyłącznie letni.","Czas słoneczny Warszawy.","Czas miejscowy równika."],["Jaki czas urzędowy obowiązuje w Polsce zimą?","UTC+1.","UTC+1.","UTC+0.","UTC+2.","UTC−1."],["Jaki czas urzędowy obowiązuje w Polsce latem?","UTC+2.","UTC+2.","UTC+0.","UTC+1.","UTC+3."],["Na czym polega ruch obiegowy Ziemi?","Na krążeniu wokół Słońca.","Na krążeniu wokół Słońca.","Na obracaniu wokół osi.","Na krążeniu wokół Księżyca.","Na przesuwaniu biegunów."],["Ile trwa rok zwrotnikowy w przybliżeniu?","365 dni i około 6 godzin.","365 dni i około 6 godzin.","24 godziny.","30 dni.","366 dni i 12 godzin."],["Jaki kształt ma orbita Ziemi?","Elipsy.","Elipsy.","Idealnego koła.","Trójkąta.","Spirali zamkniętej."],["Jak nachylona jest oś Ziemi do płaszczyzny orbity?","Około 66,5°.","Około 66,5°.","23,5°.","45°.","90°."],["Jak nachylona jest oś Ziemi do prostej prostopadłej do orbity?","Około 23,5°.","Około 23,5°.","66,5°.","45°.","90°."],["Co jest przyczyną astronomicznych pór roku?","Ruch obiegowy i nachylenie osi Ziemi.","Ruch obiegowy i nachylenie osi Ziemi.","Wyłącznie odległość od Słońca.","Wyłącznie ruch obrotowy.","Fazy Księżyca."],["Kiedy występuje przesilenie czerwcowe?","Zwykle 20 lub 21 czerwca.","Zwykle 20 lub 21 czerwca.","20 lub 21 marca.","22 lub 23 września.","21 lub 22 grudnia."],["Kiedy występuje przesilenie grudniowe?","Zwykle 21 lub 22 grudnia.","Zwykle 21 lub 22 grudnia.","20 lub 21 czerwca.","20 lub 21 marca.","22 lub 23 września."],["Kiedy występuje równonoc marcowa?","Zwykle 20 lub 21 marca.","Zwykle 20 lub 21 marca.","20 lub 21 czerwca.","22 lub 23 września.","21 lub 22 grudnia."],["Kiedy występuje równonoc wrześniowa?","Zwykle 22 lub 23 września.","Zwykle 22 lub 23 września.","20 lub 21 marca.","20 lub 21 czerwca.","21 lub 22 grudnia."],["Gdzie Słońce góruje w zenicie podczas równonocy?","Na równiku.","Na równiku.","Na zwrotniku Raka.","Na zwrotniku Koziorożca.","Na biegunie północnym."],["Gdzie Słońce góruje w zenicie podczas przesilenia czerwcowego?","Na zwrotniku Raka.","Na zwrotniku Raka.","Na równiku.","Na zwrotniku Koziorożca.","Na kole podbiegunowym."],["Gdzie Słońce góruje w zenicie podczas przesilenia grudniowego?","Na zwrotniku Koziorożca.","Na zwrotniku Koziorożca.","Na równiku.","Na zwrotniku Raka.","Na biegunie południowym."],["Kiedy w Polsce jest najdłuższy dzień?","Podczas przesilenia czerwcowego.","Podczas przesilenia czerwcowego.","Podczas przesilenia grudniowego.","Podczas równonocy marcowej.","Podczas równonocy wrześniowej."],["Kiedy w Polsce jest najkrótszy dzień?","Podczas przesilenia grudniowego.","Podczas przesilenia grudniowego.","Podczas przesilenia czerwcowego.","Podczas równonocy marcowej.","Podczas równonocy wrześniowej."],["Co to jest dzień polarny?","Okres, gdy Słońce nie zachodzi przez co najmniej dobę.","Okres, gdy Słońce nie zachodzi przez co najmniej dobę.","Okres bez wschodu Słońca.","Dzień trwający dokładnie 12 godzin.","Dzień, gdy Słońce góruje w zenicie."],["Co to jest noc polarna?","Okres, gdy Słońce nie wschodzi przez co najmniej dobę.","Okres, gdy Słońce nie wschodzi przez co najmniej dobę.","Okres bez zachodu Słońca.","Noc trwająca 12 godzin.","Noc występująca na równiku."],["Na której półkuli jest lato w grudniu?","Na południowej.","Na południowej.","Na północnej.","Na obu półkulach.","Na żadnej."],["Dlaczego wprowadzono lata przestępne?","Rok astronomiczny nie trwa dokładnie 365 dni.","Rok astronomiczny nie trwa dokładnie 365 dni.","Doba trwa dokładnie 25 godzin.","Ziemia obraca się wolniej zimą.","Księżyc obiega Ziemię co 4 lata."],["Ile dni ma luty w typowym roku przestępnym?","29 dni.","29 dni.","28 dni.","30 dni.","31 dni."],["Gdzie występuje dzień i noc polarna?","Za kołami podbiegunowymi.","Za kołami podbiegunowymi.","Między zwrotnikami.","Wyłącznie na równiku.","Na całej Ziemi."],["Co wyznaczają zwrotniki?","Najdalsze szerokości, na których Słońce może górować w zenicie.","Najdalsze szerokości, na których Słońce może górować w zenicie.","Granice stref czasowych.","Granice oceanów.","Położenie biegunów magnetycznych."],["Co oznacza termin zenit?","Punkt na niebie dokładnie nad obserwatorem.","Punkt na niebie dokładnie nad obserwatorem.","Punkt na północy horyzontu.","Miejsce zachodu Słońca.","Punkt najbliżej horyzontu."],["Jak zmienia się wysokość górowania Słońca w Polsce od zimy do lata?","Zwiększa się.","Zwiększa się.","Zmniejsza się.","Nie zmienia się.","Zawsze wynosi 90°."]];const K='leo-geografia-ruchy-ziemi-v1';let state={known:{},errors:{}};try{state={...state,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){}const $=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(state))}function mode(m){$('f').classList.toggle('hidden',m!=='f');$('q').classList.toggle('hidden',m!=='q');$('bf').classList.toggle('active',m==='f');$('bq').classList.toggle('active',m==='q')}let deck=[],fi=0,back=false;function resetF(hard){deck=T.map((_,i)=>i).filter(i=>!hard||!state.known[i]);fi=0;back=false;drawF()}function drawF(){let i=deck[fi];$('progress').textContent='Fiszka '+Math.min(fi+1,deck.length)+' / '+deck.length+' • Opanowane: '+Object.values(state.known).filter(Boolean).length+'/'+T.length;$('card').textContent=i===undefined?'Brawo! Wszystkie fiszki z tej rundy zakończone.':(back?'ODPOWIEDŹ\n\n'+T[i][1]:'PYTANIE\n\n'+T[i][0])}function flip(){if(deck[fi]!==undefined){back=!back;drawF()}}function rate(ok){let i=deck[fi];if(i===undefined)return;state.known[i]=ok;save();fi++;back=false;drawF()}let queue=[],qi=0,score=0,pick=-1,checked=false;function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function start(missed){queue=shuffle(T.map((_,i)=>i).filter(i=>!missed||state.errors[i])).slice(0,missed?40:+$('count').value);$('setup').classList.add('hidden');$('finish').classList.add('hidden');$('game').classList.remove('hidden');qi=0;score=0;if(!queue.length){$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('result').textContent='Brak błędów do powtórki!';return}drawQ()}function drawQ(){pick=-1;checked=false;let t=T[queue[qi]];$('qstat').textContent='Pytanie '+(qi+1)+' / '+queue.length+' • Punkty: '+score;$('question').textContent=t[0];$('feedback').textContent='';$('next').textContent='Sprawdź';let opts=shuffle(t.slice(2).map((s,i)=>({s,correct:i===0})));$('answers').replaceChildren();opts.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent='ABCD'[i]+'. '+o.s;b.onclick=()=>{if(checked)return;pick=i;document.querySelectorAll('.option').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen')};b.dataset.correct=o.correct?'1':'0';$('answers').appendChild(b)})}function advance(){if(!checked){if(pick<0){$('feedback').textContent='Najpierw wybierz odpowiedź.';return}checked=true;let buttons=[...document.querySelectorAll('.option')],ok=buttons[pick].dataset.correct==='1',i=queue[qi];if(ok){score++;delete state.errors[i]}else state.errors[i]=true;save();buttons.forEach((b,j)=>{if(b.dataset.correct==='1')b.classList.add('right');else if(j===pick)b.classList.add('wrong')});$('feedback').textContent=(ok?'Dobrze! ':'Do powtórki. ')+T[i][1];$('next').textContent=qi===queue.length-1?'Zobacz wynik':'Następne pytanie'}else{qi++;if(qi>=queue.length){$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('result').textContent='Wynik: '+score+' / '+queue.length+' ('+Math.round(score/queue.length*100)+'%)';$('summary').textContent='Błędne odpowiedzi możesz przećwiczyć ponownie.'}else drawQ()}}resetF(false);</script></html>
