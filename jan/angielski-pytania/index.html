<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angielski – pytania</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:#17324d;font:17px system-ui}main{max-width:780px;margin:auto;padding:18px}header,section{background:white;padding:22px;border-radius:20px;margin:14px 0}header{background:#174b79;color:white}header a{color:white}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #c5d8e8;margin:4px}button{background:#e1eef8;color:#174b79;cursor:pointer}button.primary{background:#176a99;color:white}button.audio{background:#d9f4e8;color:#125c42}#card{padding:24px 12px;text-align:center;border:2px solid #9bbcd5;border-radius:16px;min-height:180px;cursor:pointer}h2{font-size:26px}small{color:#64748b}input{width:100%;margin:5px 0}progress{width:100%}#answer{border-top:1px solid #ddd;margin-top:15px;padding-top:10px}</style><main><header><a href="../../">← Centrum Nauki</a><h1>Angielski – pytania</h1><p>32 fiszki • pytania i odpowiedzi • wymowa</p></header><section><button id="ordered">Po kolei</button><button id="random">Losowo</button><button id="review">Powtórz trudne</button><p id="status"></p><progress id="progress" max="32"></progress><div id="card" tabindex="0" role="button" aria-label="Pokaż odpowiedź"><small id="number"></small><h2 id="question"></h2><p id="translation"></p><div id="answer" hidden><h2 id="response"></h2><p id="responsePL"></p></div><p id="hint">Dotknij, aby pokazać odpowiedź</p></div><button class="audio" id="hearQ">🔊 Pytanie</button><button class="audio" id="hearA" hidden>🔊 Odpowiedź</button><div id="personal" hidden><label for="custom">Własna odpowiedź po angielsku (tylko na tym urządzeniu)</label><input id="custom" autocomplete="off"><button id="save">Zapisz lokalnie</button></div><div><button id="prev">← Wstecz</button><button id="hard">Powtórzę</button><button class="primary" id="next">Umiem / dalej →</button></div><p><small>Odpowiedzi dotyczące dnia, pogody i ubioru są przykładami. Dane osobiste można uzupełnić lokalnie. Głos zależy od przeglądarki.</small></p></section></main><script>const data=[["What's your name?","Jak masz na imię?","My name is …","Mam na imię …"],["What's your surname?","Jak masz na nazwisko?","My surname is …","Moje nazwisko to …"],["How old are you?","Ile masz lat?","I'm … years old.","Mam … lat."],["How are you today?","Jak się dziś masz?","I'm fine, thanks.","Dobrze, dziękuję."],["Which country are you from?","Z jakiego kraju pochodzisz?","I'm from Poland.","Pochodzę z Polski."],["What's your nationality?","Jakiej jesteś narodowości?","I'm Polish.","Jestem Polakiem."],["When is your birthday?","Kiedy masz urodziny?","My birthday is on …","Moje urodziny są …"],["What's your favourite season?","Jaka jest twoja ulubiona pora roku?","My favourite season is spring.","Moja ulubiona pora roku to wiosna."],["What day is it today?","Jaki dziś jest dzień?","Today is Monday.","Dzisiaj jest poniedziałek."],["Have you got a pet?","Czy masz zwierzątko?","Yes, I have.","Tak, mam."],["What's your favourite school subject?","Jaki jest twój ulubiony przedmiot szkolny?","My favourite school subject is IT.","Moim ulubionym przedmiotem jest informatyka."],["What do you do in your free time?","Co robisz w wolnym czasie?","In my free time, I play games.","W wolnym czasie gram w gry."],["What time do you usually get up?","O której zwykle wstajesz?","I usually get up at … o'clock.","Zwykle wstaję o godzinie …"],["What's your lucky number?","Jaka jest twoja szczęśliwa liczba?","My lucky number is seven.","Moja szczęśliwa liczba to siedem."],["Can you swim?","Czy umiesz pływać?","Yes, I can.","Tak, umiem."],["Have you got any brothers or sisters?","Czy masz rodzeństwo?","Yes, I have got a brother.","Tak, mam brata."],["Do you like ice cream?","Czy lubisz lody?","Yes, I do. I like ice cream.","Tak, lubię lody."],["What's your favourite sport?","Jaki jest twój ulubiony sport?","My favourite sport is judo.","Moim ulubionym sportem jest judo."],["What kind of person are you?","Jaką jesteś osobą?","I am a friendly person.","Jestem przyjazną osobą."],["Who is your best friend?","Kto jest twoim najlepszym przyjacielem?","My best friend is …","Moim najlepszym przyjacielem jest …"],["What's the weather like today?","Jaka jest dziś pogoda?","It's sunny / rainy / cloudy today.","Dziś jest słonecznie / deszczowo / pochmurno."],["What time do you go to sleep?","O której chodzisz spać?","I usually go to sleep at … p.m.","Zwykle chodzę spać o … wieczorem."],["What's your favourite colour?","Jaki jest twój ulubiony kolor?","My favourite colour is red.","Moim ulubionym kolorem jest czerwony."],["Can you cook?","Czy umiesz gotować?","Yes, I can.","Tak, umiem."],["What are you wearing today?","Co masz dziś na sobie?","Today I'm wearing a T-shirt and jeans.","Dzisiaj mam na sobie koszulkę i dżinsy."],["What's your dream job?","Jaki jest twój wymarzony zawód?","My dream job is to be a teacher.","Moim marzeniem jest zostać nauczycielem."],["How do you get to school?","Jak docierasz do szkoły?","I get to school by …","Docieram do szkoły …"],["How long does it take you?","Ile czasu ci to zajmuje?","It takes me about … minutes.","Zajmuje mi to około … minut."],["Can you ride a bike?","Czy umiesz jeździć na rowerze?","Yes, I can.","Tak, umiem."],["Who is your favourite celebrity or pop star?","Kto jest twoją ulubioną gwiazdą?","My favourite celebrity is Michael Jackson.","Moją ulubioną gwiazdą jest Michael Jackson."],["What's your favourite animal?","Jakie jest twoje ulubione zwierzę?","My favourite animal is a dog.","Moim ulubionym zwierzęciem jest pies."],["Do you live in a house or in a block of flats?","Czy mieszkasz w domu czy w bloku?","I live in …","Mieszkam w …"]];const $=id=>document.getElementById(id);let order=data.map((_,i)=>i),pos=0,open=false,hard=new Set(),custom={};try{custom=JSON.parse(localStorage.getItem('english-questions-local')||'{}')}catch(e){}function speak(t){if(!window.speechSynthesis){alert('Brak obsługi głosu. Spróbuj w Chrome.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.8;let v=speechSynthesis.getVoices().find(v=>v.lang==='en-GB');if(v)u.voice=v;speechSynthesis.speak(u)}function render(){let i=order[pos],d=data[i];$('status').textContent='Fiszka '+(pos+1)+' / '+order.length+' • Trudne: '+hard.size;$('progress').max=order.length;$('progress').value=pos+1;$('number').textContent='Pytanie '+(i+1);$('question').textContent=d[0];$('translation').textContent=d[1];$('response').textContent=custom[i]||d[2];$('responsePL').textContent=custom[i]?'Twoja własna odpowiedź':d[3];$('answer').hidden=!open;$('hearA').hidden=!open;$('personal').hidden=!open;$('hint').hidden=open;$('custom').value=custom[i]||d[2];$('prev').disabled=pos===0}function advance(){if(pos+1<order.length){pos++;open=false;render()}else{$('status').textContent='Koniec rundy! Trudne pytania: '+hard.size}}function reset(a){order=a;pos=0;open=false;render()}$('card').onclick=()=>{open=!open;render()};$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('card').click()}};$('hearQ').onclick=()=>speak(data[order[pos]][0]);$('hearA').onclick=()=>speak(custom[order[pos]]||data[order[pos]][2]);$('save').onclick=()=>{custom[order[pos]]=$('custom').value.trim();try{localStorage.setItem('english-questions-local',JSON.stringify(custom))}catch(e){alert('Nie można zapisać lokalnie.')}render()};$('prev').onclick=()=>{if(pos){pos--;open=false;render()}};$('next').onclick=()=>{hard.delete(order[pos]);advance()};$('hard').onclick=()=>{hard.add(order[pos]);advance()};$('ordered').onclick=()=>reset(data.map((_,i)=>i));$('random').onclick=()=>{let a=data.map((_,i)=>i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}reset(a)};$('review').onclick=()=>{if(hard.size)reset([...hard]);else alert('Nie oznaczono trudnych pytań.')};render();</script></html>
