<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Janek – Angielski słówka zwierzęta</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#edf4fc;color:#18334e;margin:0}main{max-width:760px;margin:auto;padding:18px}header,.panel{padding:22px;border-radius:20px;margin:15px 0;background:white;box-shadow:0 3px 16px #18334e12}header{background:#174b79;color:white}h1{font-size:27px;margin:10px 0}button,a.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:#dfeef8;color:#174b79;text-decoration:none;display:inline-block;margin:4px}button.active,.primary{background:#176a99!important;color:white!important}.card{display:grid;place-items:center;text-align:center;min-height:230px;border:2px solid #8db7d5;border-radius:20px;background:#f0f9ff;cursor:pointer;padding:25px;margin:20px 0}.card strong{font-size:36px;overflow-wrap:anywhere}.muted{color:#64748b}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers button{margin:0;min-height:65px}.good{background:#d6f7df!important}.bad{background:#ffe0df!important}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}input{font:inherit;padding:12px;width:100%;border:1px solid #a8bfd0;border-radius:10px}@media(max-width:480px){.answers{grid-template-columns:1fr}} .speak{background:#d9f4e8;color:#125c42;font-weight:700}.speak:disabled{opacity:.5}</style></head><body><main><header><a href="../../" style="color:white">← Centrum Nauki</a><h1>🐾 Angielski – słówka zwierzęta</h1><p>Janek • 25 słówek • fiszki i test</p></header><nav><button onclick="mode('cards')" id="cardsBtn">🃏 Fiszki</button><button onclick="mode('test')" id="testBtn">✏️ Test</button><button onclick="mode('list')" id="listBtn">📖 Lista słówek</button></nav><section class="panel" id="view"></section></main><script>const words=[["beak","dziób"],["claws","pazury"],["ears","uszy"],["eyes","oczy"],["feathers","pióra"],["fins","płetwy"],["fur","futro"],["head","głowa"],["horns","rogi"],["legs","nogi"],["mane","grzywa"],["mouth","pyszczek"],["neck","szyja"],["nose","nos"],["paws","łapy"],["scales","łuski"],["shell","skorupa"],["spots","łaty, cętki"],["stripes","paski"],["tail","ogon"],["teeth","zęby"],["tongue","język"],["trunk","trąba"],["whiskers","wąsy"],["wings","skrzydła"]];let deck=[],pos=0,flipped=false,questions=[],q=0,score=0,mistakes=[],locked=false;const view=document.getElementById('view');function speak(word){if(!('speechSynthesis' in window)){alert('Ta przeglądarka nie obsługuje odczytywania głosu. Spróbuj w Chrome.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.rate=0.78;u.pitch=1;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang.toLowerCase()==='en-gb')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;window.speechSynthesis.speak(u)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function mode(m){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById(m+'Btn').classList.add('active');if(m==='cards'){deck=shuffle(words.map((_,i)=>i));pos=0;flipped=false;card()}else if(m==='test'){startTest()}else{view.innerHTML='<h2>Wszystkie słówka</h2><table><tr><th>Angielski</th><th>Polski</th></tr>'+words.map(w=>'<tr><td>'+w[0]+' <button class="speak" onclick="speak(\''+w[0]+'\')" aria-label="Odtwórz wymowę '+w[0]+'">🔊</button></td><td>'+w[1]+'</td></tr>').join('')+'</table>'}}function card(){if(pos>=deck.length){view.innerHTML='<h2>🎉 Koniec fiszek!</h2><p>Przejrzano wszystkie 25 słówek.</p><button onclick="mode(\'cards\')">Powtórz</button><button onclick="mode(\'test\')">Przejdź do testu</button>';return}let w=words[deck[pos]];view.innerHTML='<p>Fiszka '+(pos+1)+' / '+deck.length+'</p><p class="muted">Kliknij kartę, aby zobaczyć tłumaczenie</p><div class="card" onclick="flipped=!flipped;card()"><div><small>'+(flipped?'Polski':'Angielski')+'</small><br><strong>'+(flipped?w[1]:w[0])+'</strong></div></div><button class="speak" onclick="speak(words[deck[pos]][0])">🔊 Posłuchaj wymowy</button><button onclick="pos++;flipped=false;card()" class="primary">Następna →</button><button onclick="deck=shuffle(deck);pos=0;flipped=false;card()">Wymieszaj</button>'}function startTest(indices){questions=shuffle(indices||words.map((_,i)=>i)).map(i=>({i,dir:Math.random()<.5?'en':'pl'}));q=0;score=0;mistakes=[];question()}function question(){locked=false;if(q>=questions.length){view.innerHTML='<h2>Wynik: '+score+' / '+questions.length+'</h2><p>'+ (score===questions.length?'Świetnie! Wszystko poprawnie!':'Błędne odpowiedzi: '+mistakes.length+'. Warto je powtórzyć.')+'</p><button class="primary" onclick="startTest()">Nowy test (25 pytań)</button>'+(mistakes.length?'<button onclick="startTest([...new Set(mistakes)])">Powtórz błędy</button>':'');return}const t=questions[q],w=words[t.i],ask=t.dir==='en'?w[1]:w[0],answer=t.dir==='en'?w[0]:w[1],col=t.dir==='en'?0:1;const distract=shuffle(words.filter((_,i)=>i!==t.i).map(x=>x[col])).slice(0,3);const opts=shuffle([answer,...distract]);view.innerHTML='<p>Pytanie '+(q+1)+' / '+questions.length+' • Punkty: '+score+'</p><h2>Jak przetłumaczyć: '+ask+'?</h2><p class="muted">Wybierz jedną poprawną odpowiedź.</p><div class="answers">'+opts.map(x=>'<button class="answer" data-value="'+x+'">'+x+'</button>').join('')+'</div><p id="feedback"></p><button id="next" class="primary" style="display:none" onclick="q++;question()">Dalej →</button>';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const correct=b.dataset.value===answer;if(correct)score++;else mistakes.push(t.i);document.querySelectorAll('.answer').forEach(z=>{z.disabled=true;if(z.dataset.value===answer)z.classList.add('good');else if(z===b)z.classList.add('bad')});document.getElementById('feedback').textContent=correct?'✅ Dobrze!':'❌ Poprawna odpowiedź: '+answer;document.getElementById('next').style.display='inline-block'})}mode('cards');</script></body></html>
